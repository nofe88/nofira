<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>NOFIRA – Small Signals Matter</title><meta name="color-scheme" content="dark">
<style>
:root{color-scheme:dark;--bg:#050b1f;--tx:#eaf2ff;--mu:#8ea3c7;--c1:#22d3ee;--c2:#3b82f6;--c3:#8b5cf6;--gl:rgba(255,255,255,.06);--bd:rgba(120,170,255,.2);--ok:#34d399;--wa:#fbbf24;--hi:#f87171;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#1b2a6b55,transparent),radial-gradient(800px 500px at -10% 30%,#5b2bb555,transparent),var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
a{color:var(--c1)}button,select,input{font:inherit;color:var(--tx);background:#0d1840;border:1px solid var(--bd);border-radius:10px;padding:8px 12px}button{cursor:pointer}button:hover{border-color:var(--c1)}.pri{background:linear-gradient(90deg,var(--c2),var(--c3));border:0;font-weight:600}
nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:#050b1fcc;backdrop-filter:blur(10px);z-index:5}nav b{letter-spacing:.3em;margin-right:8px;color:var(--c1)}nav a{padding:6px 10px;border-radius:8px;text-decoration:none;color:var(--mu)}nav a.on{background:var(--gl);color:var(--tx)}
main{max-width:1100px;margin:auto;padding:16px}.g{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.c{background:var(--gl);border:1px solid var(--bd);border-radius:16px;padding:16px;backdrop-filter:blur(8px)}h1,h2,h3{margin:.2em 0}.mu{color:var(--mu);font-size:13px}.big{font-size:26px;font-weight:700}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd)}.None,.ok{color:var(--ok)}.Low{color:var(--c1)}.Moderate{color:var(--wa)}.High{color:var(--hi)}
.bar{height:10px;border-radius:9px;background:#ffffff14;overflow:hidden}.bar i{display:block;height:100%;transition:width .4s}svg{width:100%;height:auto}.lg span{margin-right:12px;font-size:12px;color:var(--mu)}
.ev{padding:10px;border-left:3px solid var(--c2);margin:6px 0;background:var(--gl);border-radius:8px;cursor:pointer}.ev:hover{background:#ffffff12}
.demo{background:#fbbf2420;color:var(--wa);text-align:center;font-size:12px;padding:4px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:left}
.hero{text-align:center;padding:40px 0}.hero h1{font-size:clamp(56px,14vw,120px);letter-spacing:.2em;background:linear-gradient(90deg,var(--c1),var(--c3));-webkit-background-clip:text;color:transparent}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}.modal .c{background:#0a1236;max-width:700px;width:100%}textarea{width:100%;height:240px;background:#050b1f;color:var(--tx);border:1px solid var(--bd);border-radius:8px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--c1);border-top-color:transparent;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
@media print{nav,.noprint,.demo{display:none!important}body{background:#fff;color:#000}.c{background:none;border-color:#999}}
</style></head><body><div class="demo">SYNTHETIC DEMO DATA for operations and physiology. NASA data appear only in the NASA Data Explorer after import. Not a medical diagnostic system.</div><div id="app"></div>
<script>
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const AST=[{id:'AST-01',n:'Cmdr. A. Okafor',r:'Commander',ds:17,k:1,s:1},{id:'AST-02',n:'Dr. K. Mori',r:'Flight Surgeon',ds:21,k:.55,s:2},{id:'AST-03',n:'Lt. S. Reyes',r:'Pilot',ds:99,k:0,s:3}];
const cl=(x,a,b)=>Math.min(b,Math.max(a,x));
AST.forEach(a=>{const r=rng(a.s),nz=s=>(r()+r()-1)*s;a.raw=[...Array(30)].map((_,i)=>{const f=a.k*Math.max(0,(i+1-a.ds)/(30-a.ds));return{errors:Math.max(0,Math.round(1+5*f+nz(1.2))),task:42*(1+.35*f)+nz(2),corr:6*(1+.9*f)+nz(.6),sleep:7.2-1.8*f+nz(.4),hr:62+9*f+nz(2.2),fat:cl(30+35*f+nz(5),0,100),stress:cl(28+30*f+nz(5),0,100)}})});
// metric: [label, weight, direction(+1 higher is worse, -1 lower is worse), unit, observation text]
const M={errors:['Operational errors/day',25,1,'','Repeated minor operational errors'],task:['Task completion time',20,1,' min','Increased task completion time'],corr:['Error correction time',15,1,' min','Longer error correction time'],sleep:['Sleep duration',15,-1,' h','Reduced sleep duration'],hr:['Resting heart rate',10,1,' bpm','Elevated heart rate'],fat:['Fatigue indicator',10,1,'/100','Higher fatigue indicator'],stress:['Stress indicator',5,1,'/100','Higher stress indicator']};
const S={th:[20,40,65],N:{},ds:'OSD-569',vy:'',vx:'',err:'',mt:'',a:0,d:29,role:'astro',O:{},ack:{},rev:{},tf:'all',ts:'all',t1:1,t2:30,sel:null,q:'',modal:0,busy:0};
const sev=s=>s>=S.th[2]?'High':s>=S.th[1]?'Moderate':s>=S.th[0]?'Low':'None';
const f1=(x,d=1)=>(+x).toFixed(d);
function calc(a=S.a){const D=AST[a].raw.map((x,i)=>({...x,...(S.O[a+'_'+i]||{})})),b={};
 for(const k in M){const v=D.slice(0,14).map(x=>x[k]),m=v.reduce((p,c)=>p+c)/14,sd=Math.sqrt(v.reduce((p,c)=>p+(c-m)**2,0)/14);b[k]={m,sd:Math.max(sd,.05*Math.abs(m))}}
 const sc=D.map((_,i)=>{const w=D.slice(Math.max(0,i-2),i+1),con=Object.keys(M).map(k=>{const avg=w.reduce((p,c)=>p+c[k],0)/w.length,z=M[k][2]*(avg-b[k].m)/b[k].sd;return{k,avg,z,pts:M[k][1]*cl(z/3,0,1)}});const s=Math.round(con.reduce((p,c)=>p+c.pts,0));return{s,sv:sev(s),con}});
 return{D,b,sc}}
function lc(sets,i,h=140){const W=600,p=8;let g='';sets.forEach(s=>{const mn=Math.min(...s.v),mx=Math.max(...s.v),r=mx-mn||1,pt=s.v.map((y,k)=>[p+k*(W-2*p)/29,h-p-(y-mn)/r*(h-2*p)]);g+=`<polyline fill="none" stroke="${s.c}" stroke-width="2" points="${pt.map(q=>q.join(',')).join(' ')}"/>`+pt.map((q,k)=>`<circle cx="${q[0]}" cy="${q[1]}" r="${k==i?4.5:5}" fill="${k==i?s.c:'transparent'}"><title>Day ${k+1} · ${s.n}: ${f1(s.v[k])}</title></circle>`).join('')});const x=p+i*(W-2*p)/29;
 return`<svg viewBox="0 0 ${W} ${h}"><line x1="${x}" x2="${x}" y1="0" y2="${h}" stroke="#fff3" stroke-dasharray="4"/>${g}</svg><div class="lg">${sets.map(s=>`<span style="color:${s.c}">● ${s.n}</span>`).join('')}<span>(each series scaled to its own range)</span></div>`}
function bars(v,i,sc){const W=600,h=110,mx=Math.max(...v,1);return`<svg viewBox="0 0 ${W} ${h}">${v.map((y,k)=>`<rect x="${k*20+2}" y="${h-y/mx*(h-6)}" width="15" height="${y/mx*(h-6)}" rx="3" fill="${sc[k].s>=S.th[0]?'var(--wa)':'var(--c2)'}" opacity="${k>i?.2:1}"><title>Day ${k+1}: ${y} errors · score ${sc[k].s}</title></rect>`).join('')}</svg>`}
function scat(D,i){const P=D.slice(0,i+1),n=P.length,mx=P.reduce((p,c)=>p+c.sleep,0)/n,my=P.reduce((p,c)=>p+c.errors,0)/n;let sxy=0,sx=0,sy=0;P.forEach(d=>{sxy+=(d.sleep-mx)*(d.errors-my);sx+=(d.sleep-mx)**2;sy+=(d.errors-my)**2});const r=sx&&sy?sxy/Math.sqrt(sx*sy):0;
 return`<svg viewBox="0 0 300 150"><rect width="300" height="150" fill="none" stroke="var(--bd)"/>${P.map((d,k)=>`<circle cx="${(d.sleep-3)/8*280+10}" cy="${140-d.errors/12*130}" r="${k==i?6:4}" fill="${k==i?'var(--c1)':'var(--c3)'}" opacity=".8"><title>Day ${k+1}: sleep ${f1(d.sleep)} h, ${d.errors} errors</title></circle>`).join('')}</svg><div class="mu">x: sleep (h) · y: errors/day · Pearson r = <b>${f1(r,2)}</b> over days 1–${n}. Statistical association only — no causal claim.</div>`}
const col=s=>s>=65?'var(--hi)':s>=40?'var(--wa)':s>=20?'var(--c1)':'var(--ok)';
function gauge(s){return`<div class="row"><span class="big ${sev(s)}">${s}</span><span class="mu">/100 · ${sev(s)==='None'?'Within baseline':sev(s)+' deviation'}</span></div><div class="bar"><i style="width:${s}%;background:${col(s)}"></i></div>`}
function alertCard(c,i,key=S.a+'_'+i){const A=c.sc[i],top=A.con.filter(x=>x.z>=1).sort((a,b)=>b.pts-a.pts),hl=top.filter(x=>['sleep','hr','fat','stress'].includes(x.k)),op=top.filter(x=>['errors','task','corr'].includes(x.k));
 return`<div class="c" style="border-left:4px solid ${col(A.s)}"><div class="row"><b>Performance Deviation Detected</b><span class="tag ${A.sv}">${A.sv}</span><span class="tag">Score ${A.s}</span><span class="mu">Detected: Mission Day ${i+1}, 06:00 UTC (demo)</span>${S.ack[key]?'<span class="tag ok">Acknowledged</span>':''}</div>
 <p class="mu" style="margin:6px 0">The system observed (3-day average vs. days 1–14 baseline):</p><ul style="margin:0 0 6px 18px">${top.map(x=>`<li>${M[x.k][4]} (z = ${f1(x.z)})</li>`).join('')}</ul>
 <div class="mu">Health indicators: ${hl.map(x=>M[x.k][0]).join(', ')||'none deviating'} · Related operational events: ${op.map(x=>M[x.k][0]).join(', ')||'none deviating'}</div>
 <p><b>Recommended next action:</b> ${A.s>=65?'Priority review of astronaut workload and available health data with the mission control medical team.':A.s>=40?'Review astronaut workload and available health data at the next scheduled check-in.':'Continue monitoring; consider a workload and rest-schedule check.'}</p>
 <p class="mu">⚠ System-generated observation from a rule-based model. It is not a medical conclusion or diagnosis and does not establish cause.</p>
 <div class="row noprint"><button onclick="S.ack['${key}']=1;R()">Acknowledge</button><button onclick="S.rev['${key}']=!S.rev['${key}'];R()">${S.rev[key]?'Hide':'Review'} rule details</button></div>
 ${S.rev[key]?`<table style="margin-top:8px"><tr><th>Metric</th><th>3-day avg</th><th>Baseline</th><th>z</th><th>Points</th></tr>${A.con.map(x=>`<tr><td>${M[x.k][0]}</td><td>${f1(x.avg)}</td><td>${f1(c.b[x.k].m)}</td><td>${f1(x.z)}</td><td>${f1(x.pts)} / ${M[x.k][1]}</td></tr>`).join('')}</table>`:''}</div>`}
const alertsOf=c=>c.sc.map((a,i)=>({i,...a})).filter(a=>a.s>=S.th[0]).reverse();
function kpis(c){const d=c.D[S.d],A=c.sc[S.d];const K=[['Heart rate','hr','bpm'],['Sleep','sleep','h'],['Fatigue','fat',''],['Stress','stress',''],['Errors/day','errors',''],['Task time','task','min'],['Correction time','corr','min']];
 return K.map(([l,k,u])=>{const dl=d[k]-c.b[k].m,bad=dl*M[k][2]>c.b[k].sd;return`<div class="c" title="Baseline mean ${f1(c.b[k].m)}"><div class="mu">${l}</div><div class="big">${f1(d[k],k=='errors'?0:1)}<small class="mu"> ${u}</small></div><div class="mu" style="color:${bad?'var(--wa)':'var(--mu)'}">${dl>=0?'▲':'▼'} ${f1(Math.abs(dl))} vs baseline</div></div>`}).join('')}
function ctab(){const q=S.q.toLowerCase();return`<table><tr><th>Astronaut</th><th>Role</th><th>Score (Day ${S.d+1})</th><th>Level</th></tr>`+AST.map((a,i)=>({a,i,c:calc(i)})).filter(x=>(x.a.n+x.a.id+x.a.r).toLowerCase().includes(q)).map(x=>`<tr style="cursor:pointer" onclick="S.a=${x.i};R()"><td>${x.a.id} · ${x.a.n}</td><td>${x.a.r}</td><td>${x.c.sc[S.d].s}</td><td class="${x.c.sc[S.d].sv}">${x.c.sc[S.d].sv}</td></tr>`).join('')+'</table>'||'<p class=mu>No match.</p>'}
function dash(c){const A=c.sc[S.d],D=c.D,al=alertsOf(c).filter(a=>a.i<=S.d).slice(0,3),ast=AST[S.a],rec=A.s>=65?'Please request a review with mission control. This tool does not diagnose.':A.s>=20?'Consider discussing workload and rest with your flight surgeon.':'Keep your routine and protect your sleep schedule.';
 const up=D.slice(0,S.d+1);
 return`<div class="row"><h2>${S.role=='astro'?'My Overview':'Mission Control'}</h2><span class="tag">Mission Meridian-7 · Day ${S.d+1}/30</span><span class="tag">${ast.id} · ${ast.n} · ${ast.r}</span>${B.s}</div>
 <div class="g g4" style="margin:10px 0">${kpis(c)}<div class="c" style="grid-column:span 2"><div class="mu">NOFIRA Operational Deviation Index ${B.d}</div>${gauge(A.s)}</div></div>
 ${S.role=='astro'?`<div class="c" style="margin-bottom:14px"><b>Simple recommendation</b><p>${rec}</p></div>`:`<div class="c" style="margin-bottom:14px"><h3>Crew monitoring</h3><input placeholder="Search crew…" value="${S.q}" oninput="S.q=this.value;$('#ct').innerHTML=ctab()"><div id="ct">${ctab()}</div></div>`}
 <div class="g g2"><div class="c"><h3>Health trends ${B.s}</h3>${lc([{n:'Sleep',v:D.map(x=>x.sleep),c:'#22d3ee'},{n:'Heart rate',v:D.map(x=>x.hr),c:'#f87171'},{n:'Fatigue',v:D.map(x=>x.fat),c:'#8b5cf6'}],S.d)}</div>
 <div class="c"><h3>Performance trends ${B.s}</h3>${lc([{n:'Task time',v:D.map(x=>x.task),c:'#3b82f6'},{n:'Correction time',v:D.map(x=>x.corr),c:'#fbbf24'},{n:'Deviation index',v:c.sc.map(x=>x.s),c:'#34d399'}],S.d)}</div>
 <div class="c"><h3>Operational errors timeline ${B.s}</h3>${bars(D.map(x=>x.errors),S.d,c.sc)}<div class="mu">Amber bars: days with score ≥ 20</div></div>
 <div class="c"><h3>Health–performance correlation ${B.d}</h3>${scat(D,S.d)}</div></div>
 <div class="c" style="margin-top:14px"><div class="row"><h3>Recent alerts</h3><a href="#alerts">All alerts →</a></div>${al.map(a=>alertCard(c,a.i)).join('')||'<p class="mu">No alerts up to this day — all signals within baseline.</p>'}</div>`}
function alerts(c){const al=alertsOf(c).filter(a=>a.i<=S.d);return`<h2>Explainable Alerts</h2><p class="mu">${al.length} alert day(s) up to Day ${S.d+1}. Alerts trigger when the index ≥ ${S.th[0]}.</p><div class="g">${al.slice(0,15).map(a=>alertCard(c,a.i)).join('')||'<div class="c">No alerts. All signals are within the personal baseline.</div>'}</div>`}
function evs(c){const E=[];c.D.forEach((d,i)=>{if(i>S.d)return;const sv=c.sc[i].sv;E.push({i,t:'task',sv,x:`6 tasks completed, avg ${f1(d.task)} min`},{i,t:'sleep',sv,x:`Sleep period ${f1(d.sleep)} h`},{i,t:'health',sv,x:`HR ${f1(d.hr)} bpm · fatigue ${f1(d.fat,0)} · stress ${f1(d.stress,0)}`});if(d.errors)E.push({i,t:'error',sv,x:`${d.errors} operational error(s)`},{i,t:'correction',sv,x:`Corrections avg ${f1(d.corr)} min`});if(c.sc[i].s>=S.th[0])E.push({i,t:'alert',sv,x:`${sv} alert · score ${c.sc[i].s}`})});return E.reverse()}
function tl(c){const E=evs(c).filter(e=>(S.tf=='all'||e.t==S.tf)&&(S.ts=='all'||e.sv==S.ts)&&e.i+1>=S.t1&&e.i+1<=S.t2),sl=E[S.sel];
 const o=(v,a)=>a.map(x=>`<option ${v==x?'selected':''}>${x}</option>`).join('');
 return`<h2>Mission Timeline</h2><div class="row c noprint">Type <select onchange="S.tf=this.value;S.sel=null;R()">${o(S.tf,['all','task','error','correction','health','sleep','alert'])}</select>Severity <select onchange="S.ts=this.value;S.sel=null;R()">${o(S.ts,['all','None','Low','Moderate','High'])}</select>Days <input type="number" min="1" max="30" value="${S.t1}" style="width:70px" onchange="S.t1=+this.value;S.sel=null;R()">– <input type="number" min="1" max="30" value="${S.t2}" style="width:70px" onchange="S.t2=+this.value;S.sel=null;R()"></div>
 <div class="g g2" style="margin-top:12px"><div>${E.slice(0,50).map((e,k)=>`<div class="ev" onclick="S.sel=${k};R()"><b>Day ${e.i+1}</b> · <span class="tag">${e.t}</span> <span class="${e.sv}">${e.sv}</span><br>${e.x}</div>`).join('')||'<div class="c">No events match these filters.</div>'}${E.length>50?`<p class="mu">Showing newest 50 of ${E.length}. Narrow filters to see more.</p>`:''}</div>
 <div class="c" style="align-self:start;position:sticky;top:70px">${sl?`<h3>${sl.t.toUpperCase()} · Day ${sl.i+1}</h3><p>${sl.x}</p><p class="mu">Day deviation level: <span class="${sl.sv}">${sl.sv}</span> (score ${c.sc[sl.i].s})</p>${c.sc[sl.i].con.filter(x=>x.pts>0).sort((a,b)=>b.pts-a.pts).slice(0,3).map(x=>`<div class="mu">${M[x.k][0]}: z ${f1(x.z)}, +${f1(x.pts)} pts</div>`).join('')}`:'<p class="mu">Select an event to see its details.</p>'}</div></div>`}
function simOut(){const c=calc(),A=c.sc[S.d],O0=S.O;S.O={};const b0=calc().sc[S.d].s;S.O=O0;return`<div class="c"><p class="mu">Before → after edits: <b>${b0}</b> → <b>${A.s}</b> ${B.d} · inputs ${B.s}</p>${gauge(A.s)}${lc([{n:'Deviation index',v:c.sc.map(x=>x.s),c:'#34d399'},{n:'Errors',v:c.D.map(x=>x.errors),c:'#fbbf24'},{n:'Sleep',v:c.D.map(x=>x.sleep),c:'#22d3ee'}],S.d,120)}<table>${A.con.map(x=>`<tr><td>${M[x.k][0]}</td><td>${f1(x.avg)}${M[x.k][3]}</td><td>z ${f1(x.z)}</td><td><div class="bar"><i style="width:${x.pts/M[x.k][1]*100}%;background:${col(A.s)}"></i></div></td><td>${f1(x.pts)}/${M[x.k][1]}</td></tr>`).join('')}</table></div>${S.busy?'<div class="c"><span class="spin"></span> Running analysis engine…</div>':A.s>=20?alertCard(c,S.d,'sim'+S.a+'_'+S.d):'<div class="c">Analysis complete: no alert generated for this day. Try lowering sleep or raising errors and task time.</div>'}`}
function sim(){const c=calc(),d=c.D[S.d],sl=[['sleep','Sleep (h)',3,10,.1],['hr','Heart rate (bpm)',50,110,1],['errors','Errors / day',0,12,1],['task','Task time (min)',20,90,1],['corr','Correction time (min)',2,25,.5]];
 return`<h2>Interactive Simulation</h2><p class="mu">Choose an astronaut and mission day in the top bar, then edit that day’s values. The analysis engine recomputes the score from the 3-day window; edits also shift the next 2 days’ windows.</p><div class="g g2"><div class="c">${sl.map(([k,l,a,b,s])=>`<label class="mu">${l}: <b id="v${k}">${f1(d[k])}</b></label><input type="range" style="width:100%;padding:0" min="${a}" max="${b}" step="${s}" value="${d[k]}" oninput="S.O[S.a+'_'+S.d]={...S.O[S.a+'_'+S.d],${k}:+this.value};$('#v${k}').textContent=(+this.value).toFixed(1);$('#so').innerHTML=simOut()">`).join('')}<div class="row" style="margin:8px 0"><b class="mu">Scenarios:</b><button onclick="S.O={};S.a=2;S.d=29;R()">Normal Operations</button><button onclick="S.O={};S.a=1;S.d=29;R()">Gradual Deviation</button><button onclick="S.O={};S.a=0;S.d=29;R()">Accumulated Errors</button></div><div class="row" style="margin-top:10px"><button class="pri" onclick="S.busy=1;$('#so').innerHTML=simOut();setTimeout(()=>{S.busy=0;$('#so').innerHTML=simOut()},700)">Run analysis</button><button onclick="delete S.O[S.a+'_'+S.d];R()">Reset day</button><button onclick="S.O={};R()">Reset all</button></div></div><div id="so" class="g">${simOut()}</div></div>`}
function method(){return`<h2>Methodology & About NOFIRA</h2><div class="g g2"><div class="c"><h3>The innovation</h3><p>Single small mistakes look like noise. NOFIRA treats <b>accumulated small signals</b> — repeated errors, slower tasks, longer corrections — together with sleep, heart rate, fatigue and stress, and flags when the pattern drifts from the astronaut’s <i>own</i> baseline.</p><p class="mu"><b>Scope:</b> research and decision-support prototype. It does not diagnose disease and does not claim a causal link between health indicators and errors. Operational data are simulated (SYNTHETIC DEMO). NASA OSD-569 / OSD-575 data appear only after you import the original files. Scores are DERIVED ANALYSIS. The categories are never mixed silently.</p></div>
 <div class="c"><h3>Algorithm (rule-based, deterministic)</h3><ol><li>Baseline: mean and SD of mission days 1–14 per metric (SD floor 5% of mean).</li><li>Current value: mean of the last 3 days.</li><li>z = direction × (current − baseline mean) / SD, where direction is −1 for sleep.</li><li>Points = weight × clamp(z/3, 0, 1).</li><li>Score = sum of points (0–100). Alert levels: Low ≥ 20, Moderate ≥ 40, High ≥ 65.</li></ol></div>
 <div class="c"><h3>Weights</h3><table>${Object.values(M).map(m=>`<tr><td>${m[0]}</td><td>${m[1]}</td></tr>`).join('')}</table></div>
 <div class="c"><h3>Data schema (per astronaut-day)</h3><p class="mu">day, errors (count), task (min), corr (min), sleep (h), hr (bpm), fat (0–100), stress (0–100). Seeded generator; Okafor drifts from day 18, Mori mildly from day 22, Reyes stays stable.</p><p class="mu">Limitations: thresholds are illustrative and not clinically validated; real use needs validated data and expert review.</p></div></div>`}
function report(c){const A=c.sc[S.d];return`<h2>Mission Report — ${AST[S.a].id} ${AST[S.a].n}</h2><p class="mu">Day ${S.d+1} · DEMO DATA · decision-support only</p><div class="c">${gauge(A.s)}<table>${A.con.map(x=>`<tr><td>${M[x.k][0]}</td><td>${f1(x.avg)}${M[x.k][3]}</td><td>baseline ${f1(c.b[x.k].m)}</td><td>z ${f1(x.z)}</td></tr>`).join('')}</table></div><h3>Alerts</h3><div class="g">${alertsOf(c).filter(a=>a.i<=S.d).slice(0,5).map(a=>alertCard(c,a.i)).join('')||'<p>None.</p>'}</div><p class="noprint"><button class="pri" onclick="window.print()">Print / Save as PDF</button></p>`}
function csv(){const c=calc();return'astronaut,day,errors,task_min,corr_min,sleep_h,hr_bpm,fatigue,stress,risk_score,level\n'+c.D.map((d,i)=>[AST[S.a].id,i+1,d.errors,f1(d.task),f1(d.corr),f1(d.sleep),f1(d.hr),f1(d.fat),f1(d.stress),c.sc[i].s,c.sc[i].sv].join(',')).join('\n')}
function home(){return`<div class="hero"><svg viewBox="0 0 200 140" style="max-width:220px"><defs><linearGradient id="gg"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><ellipse cx="100" cy="70" rx="95" ry="30" fill="none" stroke="#3b82f6" opacity=".5" transform="rotate(-18 100 70)"/><circle cx="100" cy="62" r="40" fill="#0d1840" stroke="url(#gg)" stroke-width="3"/><rect x="72" y="46" width="56" height="34" rx="17" fill="#22d3ee" opacity=".25" stroke="#22d3ee"/><circle cx="88" cy="56" r="4" fill="#fff" opacity=".7"/><rect x="70" y="100" width="60" height="30" rx="14" fill="#0d1840" stroke="url(#gg)" stroke-width="3"/></svg><h1>NOFIRA</h1><h2 style="font-weight:300">Small Signals Matter.</h2><p class="mu" style="max-width:640px;margin:12px auto">An intelligent astronaut health and performance monitoring platform that identifies accumulated operational signals and explores their relationship with human health indicators throughout space missions.</p><a href="#dashboard"><button class="pri" style="padding:14px 28px;font-size:17px">Launch Mission Dashboard</button></a> <a href="#method"><button style="padding:14px 28px;font-size:17px">Explore Technology</button></a></div>
 <div class="g g2">${[['Personal baselines','Each astronaut is compared with their own first 14 days.'],['Explainable alerts','Every alert lists the signals, weights and rule that produced it.'],['Interactive simulation','Change sleep, heart rate and errors, then watch the score respond.'],['Two views','Astronaut self-view and mission control investigation view.'],['NASA Data Explorer','Import OSD-569 / OSD-575 files; each chart shows its source and data class.']].map(x=>`<div class="c"><h3>${x[0]}</h3><p class="mu">${x[1]}</p></div>`).join('')}</div>
 <h2 style="margin-top:30px">Explore the Technology</h2><div class="c"><p>NOFIRA is a transparent statistical model — weighted z-scores over a 3-day rolling window — not a black box. Judges can open any alert, inspect the contributing metrics, and test the engine in the <a href="#simulate">simulation</a>. Read the <a href="#method">methodology</a>.</p></div>`}
const $=s=>document.querySelector(s);
const B={s:'<span class="tag" style="color:#fbbf24">SYNTHETIC DEMO</span>',d:'<span class="tag" style="color:#22d3ee">DERIVED ANALYSIS</span>',n:'<span class="tag" style="color:#34d399">REAL NASA DATA</span>'};
const ST={'OSD-569':{t:'SpaceX Inspiration4 Whole Blood Measurements',u:'https://osdr.nasa.gov/bio/repo/data/studies/OSD-569',k:'Complete blood count, whole-blood indicators'},'OSD-575':{t:'SpaceX Inspiration4 Blood Serum Metabolic Panel and Immune/Cardiac Cytokine Arrays',u:'https://osdr.nasa.gov/bio/repo/data/studies/OSD-575',k:'Metabolic panel, immune and cardiac cytokines'}};
const miss=v=>v===undefined||v===''||/^(na|nan|null|n\/a)$/i.test(String(v).trim());
function parseCSV(t){const l=t.split('\n')[0],d=l.split('\t').length>l.split(',').length?'\t':',',rows=[];let r=[],f='',q=0;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){f+='"';i++}else q=0}else f+=ch}else if(ch=='"')q=1;else if(ch==d){r.push(f);f=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(f);f='';if(r.length>1||r[0]!=='')rows.push(r);r=[]}else f+=ch}if(f!==''||r.length){r.push(f);rows.push(r)}return rows}
function upl(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const rows=parseCSV(rd.result);if(rows.length<2)throw 0;S.N[S.ds]={file:f.name,cols:rows[0],rows:rows.slice(1,5001)};try{localStorage.setItem('nofiraN',JSON.stringify(S.N))}catch(e){}S.err='';S.vy='';S.vx=''}catch(e){S.err='Could not parse this file as CSV/TSV with a header row. Excel files must be exported to CSV first.'}R()};rd.onerror=()=>{S.err='The file could not be read.';R()};rd.readAsText(f)}
try{S.N=JSON.parse(localStorage.getItem('nofiraN')||'{}')}catch(e){S.N={}}
function expN(){const N=S.N[S.ds],yi=N.cols.indexOf(S.vy),xi=N.cols.indexOf(S.vx),q=s=>'"'+String(s||'').replace(/"/g,'""')+'"';S.mt='# Source: NASA OSDR '+S.ds+' · uploaded file '+N.file+' · original values, no imputation\n'+(xi>=0?q(S.vx)+',':'')+q(S.vy)+'\n'+N.rows.map(r=>(xi>=0?q(r[xi])+',':'')+q(r[yi])).join('\n');S.modal=1;R()}
function nasa(){const N=S.N[S.ds],I=ST[S.ds];
 const hd=`<h2>NASA Data Explorer</h2><div class="row c"><select onchange="S.ds=this.value;S.vy='';S.vx='';R()">${Object.keys(ST).map(k=>`<option ${k==S.ds?'selected':''}>${k}</option>`).join('')}</select><span>${I.t}</span><a href="${I.u}" target="_blank" rel="noopener">OSDR page ↗</a></div><p class="mu">This prototype contains <b>no NASA measurements</b> until you import them. Download a data file (CSV/TSV) from the OSDR page and upload it here. Nothing is estimated, interpolated or invented; sparse samples stay sparse.</p><div class="c"><input type="file" accept=".csv,.tsv,.txt" onchange="upl(this)">${S.err?`<p class="High">${S.err}</p>`:''}</div>`;
 if(!N)return hd+`<div class="c">Import status: <b>Not imported</b> for ${S.ds}.</div>`;
 const nc=N.cols.map((c,i)=>{const v=N.rows.map(r=>r[i]||''),m=v.filter(miss).length,nn=v.filter(x=>!miss(x)&&!isNaN(+x)).length;return{c,i,m,n:v.length,num:nn>0&&nn>=.6*(v.length-m)}});
 const nums=nc.filter(x=>x.num);if(!nc.find(x=>x.c==S.vy))S.vy=(nums[0]||nc[0]).c;if(S.vx&&!nc.find(x=>x.c==S.vx))S.vx='';
 const y=nc.find(x=>x.c==S.vy),g=nc.find(x=>x.c==S.vx);
 const vals=N.rows.map(r=>({v:miss(r[y.i]||'')?null:+r[y.i],t:g?r[g.i]:''})),mx=Math.max(1e-9,...vals.map(x=>Math.abs(x.v||0)));
 const ch=y.num?`<svg viewBox="0 0 600 140">${vals.slice(0,150).map((x,k)=>x.v==null?'':`<rect x="${k*4}" y="${130-Math.abs(x.v)/mx*120}" width="3" height="${Math.abs(x.v)/mx*120}" fill="#22d3ee"><title>Record ${k+1}${g?' · '+g.c+': '+x.t:''} · ${y.c}: ${x.v}</title></rect>`).join('')}</svg>`:'<p class="mu">Selected variable is not numeric.</p>';
 let cmp='';if(g&&y.num){const G={};vals.forEach(x=>{if(x.v!=null)(G[x.t]=G[x.t]||[]).push(x.v)});const ks=Object.keys(G);cmp=ks.length>1&&ks.length<=12?`<div class="c"><h3>Group comparison by ${g.c} ${B.d}</h3><table><tr><th>${g.c}</th><th>n</th><th>mean ${y.c}</th></tr>${ks.map(k=>`<tr><td>${k}</td><td>${G[k].length}</td><td>${f1(G[k].reduce((p,c)=>p+c)/G[k].length,3)}</td></tr>`).join('')}</table><p class="mu">Means of original values per group. Nothing was filled in.</p></div>`:'<p class="mu">Choose a time/group column with 2–12 distinct values to compare groups.</p>'}
 const op=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('');
 return hd+`<div class="c"><div class="row">Variable <select onchange="S.vy=this.value;R()">${op((nums.length?nums:nc).map(x=>x.c),S.vy)}</select>Timepoint / group <select onchange="S.vx=this.value;R()"><option value="">(none)</option>${op(nc.map(x=>x.c),S.vx)}</select><button onclick="expN()">Export CSV</button></div>
 <h3>${y.c} ${B.n}</h3>${ch}<p class="mu">Source: NASA OSDR ${S.ds} · file ${N.file} · ${N.rows.length} records · original units and sampling preserved.</p></div>${cmp}
 <div class="c" style="overflow-x:auto"><h3>Metadata & missing values</h3><table><tr><th>Variable</th><th>Type</th><th>Missing</th></tr>${nc.slice(0,60).map(x=>`<tr><td>${x.c}</td><td>${x.num?'numeric':'text'}</td><td>${x.m}/${x.n} (${f1(x.m/Math.max(1,x.n)*100)}%)</td></tr>`).join('')}</table></div>
 <div class="c" style="overflow-x:auto"><h3>Measurements (first 15 rows)</h3><table><tr>${N.cols.slice(0,8).map(c=>`<th>${c}</th>`).join('')}</tr>${N.rows.slice(0,15).map(r=>`<tr>${r.slice(0,8).map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</table></div>`}
function sources(){const rows=Object.keys(ST).map(k=>{const N=S.N[k],I=ST[k];let st='<span class="High">Not imported</span>',rc='—',ms='—';if(N){const tot=N.rows.length*N.cols.length,m=N.rows.reduce((p,r)=>p+N.cols.reduce((q,_,i)=>q+(miss(r[i]||'')?1:0),0),0);st='<span class="ok">Imported ('+N.file+')</span>';rc=N.rows.length+' rows × '+N.cols.length+' cols';ms=f1(m/tot*100)+'% of cells'}return`<tr><td>${B.n} ${I.t}</td><td>${k}</td><td><a href="${I.u}" target="_blank" rel="noopener">OSDR</a></td><td>${I.k}</td><td>As in original file</td><td>${rc}</td><td>${ms}</td><td>Original timepoints (see Explorer)</td><td>${st}</td></tr>`}).join('');
return`<h2>Data Sources</h2><div class="c" style="overflow-x:auto"><table><tr><th>Study</th><th>Accession</th><th>Source</th><th>Data type</th><th>Units</th><th>Records</th><th>Missing</th><th>Timepoints</th><th>Status</th></tr>${rows}<tr><td>${B.s} Simulated astronaut telemetry</td><td>—</td><td>Seeded generator</td><td>Sleep, HR, fatigue, stress, errors, task and correction time</td><td>h, bpm, 0–100, count, min</td><td>3 × 30 days × 7</td><td>0%</td><td>Daily</td><td>Generated</td></tr><tr><td>${B.d} Operational Deviation Index</td><td>—</td><td>NOFIRA engine</td><td>0–100 index</td><td>points</td><td>90 days</td><td>0%</td><td>Daily</td><td>Computed</td></tr></table></div>`}
function profiles(){return`<h2>Astronaut Profiles</h2><div class="g g2">${AST.map((a,i)=>{const A=calc(i).sc[S.d];return`<div class="c"><h3>${a.n}</h3><p class="mu">${a.id} · ${a.r} · ${B.s}</p>${gauge(A.s)}<p class="mu">Scenario: ${a.k==0?'Normal operations':a.k<1?'Gradual deviation from day '+(a.ds+1):'Accumulated errors from day '+(a.ds+1)}</p><button onclick="S.a=${i};location.hash='dashboard'">Open overview</button></div>`}).join('')}</div>`}
function health(c){const D=c.D;return`<h2>Health Intelligence</h2><div class="g g2">${[['Sleep (h)','sleep','#22d3ee'],['Heart rate (bpm)','hr','#f87171'],['Fatigue','fat','#8b5cf6'],['Stress','stress','#fbbf24']].map(([n,k,cc])=>`<div class="c"><h3>${n} ${B.s}</h3>${lc([{n,v:D.map(x=>x[k]),c:cc}],S.d)}</div>`).join('')}</div><div class="c" style="margin-top:14px"><h3>Biological research data ${B.n}</h3><p class="mu">Kept separate from simulated values. ${Object.keys(S.N).length?'Imported: '+Object.keys(S.N).join(', '):'None imported yet'}. Open the <a href="#nasa">NASA Data Explorer</a>. Sparse research samples are never shown as continuous monitoring.</p></div>`}
function perf(c){const D=c.D,A=c.sc[S.d];return`<h2>Performance Intelligence</h2><div class="g g2"><div class="c"><h3>Errors per day ${B.s}</h3>${bars(D.map(x=>x.errors),S.d,c.sc)}</div><div class="c"><h3>Task and correction time ${B.s}</h3>${lc([{n:'Task',v:D.map(x=>x.task),c:'#3b82f6'},{n:'Correction',v:D.map(x=>x.corr),c:'#fbbf24'}],S.d)}</div></div><div class="c" style="margin-top:14px"><h3>Change vs baseline ${B.d}</h3><table><tr><th>Metric</th><th>3-day avg</th><th>Baseline</th><th>Change</th></tr>${A.con.map(x=>`<tr><td>${M[x.k][0]}</td><td>${f1(x.avg)}</td><td>${f1(c.b[x.k].m)}</td><td>${f1((x.avg/c.b[x.k].m-1)*100)}%</td></tr>`).join('')}</table></div>`}
function engine(c){const A=c.sc[S.d];return`<h2>NOFIRA Analysis Engine</h2><div class="c"><h3>Operational Deviation Index ${B.d}</h3>${gauge(A.s)}<p class="mu">Index = Σ weight × clamp(z ÷ 3, 0, 1); z = direction × (3-day mean − baseline mean) ÷ baseline SD (baseline = days 1–14). An operational index, not a medical risk score.</p></div><div class="c" style="margin-top:14px"><h3>Configurable thresholds</h3><div class="row">${['Low','Moderate','High'].map((n,i)=>`<label>${n} ≥ <input type="number" min="1" max="100" style="width:80px" value="${S.th[i]}" onchange="S.th[${i}]=+this.value;R()"></label>`).join('')}<button onclick="S.th=[20,40,65];R()">Defaults</button></div></div><div class="c" style="margin-top:14px"><h3>Contributing variables (Day ${S.d+1})</h3><table><tr><th>Variable</th><th>Weight</th><th>z</th><th>Points</th></tr>${A.con.map(x=>`<tr><td>${M[x.k][0]}</td><td>${M[x.k][1]}</td><td>${f1(x.z)}</td><td>${f1(x.pts)}</td></tr>`).join('')}</table></div>`}
function about(){return`<h2>About NOFIRA</h2><div class="c"><p>NOFIRA — Small Signals Matter. Built for the NASA Space Apps Challenge 2026: <i>Create Health Monitoring Software for Astronauts on Space Missions</i>.</p><p>Single small errors look like noise; accumulated patterns are the signal. NOFIRA tracks each astronaut against their own baseline and explains every alert.</p><p class="mu"><b>Limitations:</b> research and decision-support prototype, not a diagnostic system. Operational and physiological telemetry here is synthetic. NASA OSD-569 and OSD-575 are sparse biological samples and are never presented as continuous monitoring. Correlation is not causation.</p></div>`}
function R(){const h=(location.hash.slice(1)||'home');if(h=='control')S.role='mc';if(h=='astronaut')S.role='astro';const c=calc(),pages={home:()=>home(),dashboard:()=>dash(c),control:()=>dash(c),astronaut:()=>dash(c),profiles:()=>profiles(),health:()=>health(c),performance:()=>perf(c),engine:()=>engine(c),alerts:()=>alerts(c),timeline:()=>tl(c),simulate:()=>sim(),nasa:()=>nasa(),sources:()=>sources(),method:()=>method(),about:()=>about(),report:()=>report(c)};
 const nav=[['home','Home'],['dashboard','Overview'],['profiles','Profiles'],['health','Health'],['performance','Performance'],['engine','Engine'],['alerts','Alerts'],['timeline','Timeline'],['control','Mission Control'],['astronaut','Astronaut'],['simulate','Simulation Lab'],['nasa','NASA Data'],['sources','Sources'],['method','Method'],['about','About']];
 const o=(a,v)=>a.map((x,i)=>`<option value="${i}" ${i==v?'selected':''}>${x}</option>`).join('');
 $('#app').innerHTML=`<nav><b>NOFIRA</b>${nav.map(n=>`<a href="#${n[0]}" class="${h==n[0]?'on':''}">${n[1]}</a>`).join('')}</nav>
 ${!['home','method','about','sources','nasa'].includes(h)?`<div class="row noprint" style="padding:10px 16px;max-width:1100px;margin:auto"><select onchange="S.role=this.value;R()"><option value="astro" ${S.role=='astro'?'selected':''}>Astronaut view</option><option value="mc" ${S.role=='mc'?'selected':''}>Mission control view</option></select><select onchange="S.a=+this.value;R()">${o(AST.map(a=>a.id+' · '+a.n),S.a)}</select><select onchange="S.d=+this.value;S.sel=null;R()">${o([...Array(30)].map((_,i)=>'Day '+(i+1)),S.d)}</select><button onclick="S.modal=1;R()">Export CSV</button><a href="#report"><button>PDF report</button></a></div>`:''}
 <main>${h!='home'?'<div class="mu" style="margin-bottom:8px">Data classes: '+B.n+' '+B.s+' '+B.d+'</div>':''}${(pages[h]||pages.home)()}</main>${S.modal?`<div class="modal"><div class="c"><h3>CSV export — ${S.mt?'NASA '+S.ds+' (uploaded file)':AST[S.a].id+' · SYNTHETIC + DERIVED'}</h3><textarea readonly id="cv">${S.mt||csv()}</textarea><div class="row"><button class="pri" onclick="try{navigator.clipboard.writeText($('#cv').value)}catch(e){$('#cv').select()}">Copy</button><button onclick="try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('#cv').value],{type:'text/csv'}));a.download='nofira_${AST[S.a].id}.csv';a.click()}catch(e){}">Try download</button><button onclick="S.modal=0;S.mt='';R()">Close</button></div></div></div>`:''}`}
addEventListener('hashchange',()=>{R();scrollTo(0,0)});R();
</script></body></html>
