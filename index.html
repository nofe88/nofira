</style></head><body><div class="demo">SYNTHETIC DEMO DATA for operations and physiology. NASA data appear only in the NASA Data Explorer after import. Not a medical diagnostic system.</div><div id="app"></div>
<script>
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const AST=[{id:'AST-01',n:'Cmdr. A. Okafor',r:'Commander',ds:17,k:1,s:1,m:{errors:1,proc:1,task:.4,corr:.6,sleep:.6,hr:.5,fat:.7,stress:.7},lab:'Accumulated minor errors (from day 18)'},{id:'AST-02',n:'Dr. K. Mori',r:'Flight Surgeon',ds:14,k:1,s:2,m:{errors:.25,proc:.25,task:1,corr:1,sleep:.8,hr:.4,fat:.7,stress:.4},lab:'Gradual performance deviation (from day 15)'},{id:'AST-03',n:'Lt. S. Reyes',r:'Pilot',ds:99,k:0,s:3,m:{},lab:'Normal operations (isolated errors only)'}];
const cl=(x,a,b)=>Math.min(b,Math.max(a,x));
AST.forEach(a=>{const r=rng(a.s),nz=s=>(r()+r()-1)*s,mm=k=>a.m[k]||0;a.raw=[...Array(30)].map((_,i)=>{const f=a.k*Math.max(0,(i+1-a.ds)/(30-a.ds));return{errors:Math.max(0,Math.round(1+5*f*mm('errors')+nz(1.2)))+(a.k==0&&(i==8||i==20)?2:0),proc:Math.max(0,Math.round(.4+4*f*mm('proc')+nz(.8))),task:42*(1+.35*f*mm('task'))+nz(2),corr:6*(1+.9*f*mm('corr'))+nz(.6),sleep:7.2-1.8*f*mm('sleep')+nz(.4),hr:62+9*f*mm('hr')+nz(2.2),fat:cl(30+35*f*mm('fat')+nz(5),0,100),stress:cl(28+30*f*mm('stress')+nz(5),0,100)}})});
// metric: [label, weight, direction(+1 higher is worse, -1 lower is worse), unit, observation text]
const M={errors:['Operational errors/day',20,1,'','Repeated minor operational errors',.75],task:['Task completion time',20,1,' min','Increased task completion time',1.5],corr:['Error correction time',15,1,' min','Longer error correction time',.5],proc:['Procedural deviations',15,1,'','Repeated procedural deviations',.5],sleep:['Sleep duration',10,-1,' h','Reduced sleep duration',.3],hr:['Resting heart rate',5,1,' bpm','Elevated heart rate',2],fat:['Fatigue indicator',10,1,'/100','Higher fatigue indicator',3],stress:['Stress indicator',5,1,'/100','Higher stress indicator',3]};
const KEYS=Object.keys(M),clamp=(x,a,b)=>Math.min(b,Math.max(a,x)),okn=x=>x!=null&&!isNaN(x);
const sevT=(s,t)=>s>=t[2]?'High':s>=t[1]?'Moderate':s>=t[0]?'Observation':'Normal';
function cfgW(){const w={};KEYS.forEach(k=>w[k]=M[k][1]);return w}
function analyze(D,cfg){const W=cfg.w,b={},bs=D.slice(cfg.bl[0]-1,cfg.bl[1]);
 KEYS.forEach(k=>{const v=bs.map(x=>x[k]).filter(okn);if(v.length<5){b[k]={m:NaN,sd:1,n:v.length,na:1};return}const m=v.reduce((p,c)=>p+c)/v.length,sd=Math.sqrt(v.reduce((p,c)=>p+(c-m)**2,0)/v.length);b[k]={m,sd:Math.max(sd,.05*Math.abs(m),M[k][5]),n:v.length}});
 const sc=D.map((_,i)=>{const w=D.slice(Math.max(0,i-2),i+1);let Wa=0,P=0;const con=KEYS.map(k=>{const v=w.map(x=>x[k]).filter(okn),avg=v.length?v.reduce((p,c)=>p+c)/v.length:null;if(avg==null||b[k].na)return{k,avg,z:null,pts:0,ex:1};const z=M[k][2]*(avg-b[k].m)/b[k].sd,pts=W[k]*clamp(z/3,0,1);Wa+=W[k];P+=pts;return{k,avg,z,pts}});const s=Wa?Math.round(100*P/Wa):0;return{s,sv:sevT(s,cfg.th),con,na:!Wa}});
 const g=(j,k)=>D[j]&&okn(D[j][k])?D[j][k]:NaN,hi=(j,k,t)=>{const v=g(j,k);return !b[k].na&&M[k][2]*(v-b[k].m)/b[k].sd>t},zi=(i,k)=>sc[i].con.find(x=>x.k==k).z;
 sc.forEach((r,i)=>{const p=[],r3=[i-2,i-1,i].filter(j=>j>=0),rep=k=>r3.filter(j=>hi(j,k,.5)).length>=2;
  if(rep('errors'))p.push('Repeated minor errors');else if(hi(i,'errors',1)&&r3.filter(j=>j!=i&&hi(j,'errors',.5)).length==0)p.push('Isolated error');
  if(i>=2&&g(i,'task')>g(i-1,'task')&&g(i-1,'task')>g(i-2,'task')&&hi(i,'task',1))p.push('Gradually increasing task duration');
  if(i>=2&&g(i,'corr')>g(i-1,'corr')&&g(i-1,'corr')>g(i-2,'corr')&&hi(i,'corr',1))p.push('Increasing correction time');
  if(rep('proc'))p.push('Repeated procedural deviations');
  if(['errors','task','corr','proc'].filter(k=>(zi(i,k)||0)>=1).length>=3)p.push('Accumulating deviations across indicators');
  if(i>=5){const mx=Math.max(...sc.slice(i-5,i).map(x=>x.s));if(mx>=cfg.th[0]&&r.s<=.6*mx)p.push('Recovery toward baseline')}
  r.pat=p});
 return{b,sc}}
function runTests(){const mk=f=>[...Array(30)].map((_,i)=>f({errors:1,task:40+i%2,corr:5+.2*(i%2),proc:0,sleep:7.2,hr:62,fat:30,stress:28},i)),cfg={w:cfgW(),bl:[1,14],th:[20,40,65]},T=[],t=(n,ok,d)=>T.push({n,ok:!!ok,d}),has=(r,i,p)=>r.sc[i].pat.includes(p);
 let r=analyze(mk(x=>x),cfg);t('1 Stable baseline: no alert, no pattern',r.sc.every(x=>x.s<20&&!x.pat.length),'max index '+Math.max(...r.sc.map(x=>x.s)));
 r=analyze(mk((x,i)=>(i==19&&(x.errors=4),x)),cfg);t('2 One isolated error: isolated, no alert',has(r,19,'Isolated error')&&!has(r,19,'Repeated minor errors')&&r.sc[19].s<20,'index '+r.sc[19].s);
 r=analyze(mk((x,i)=>(i>=19&&i<=21&&(x.errors=4),x)),cfg);t('3 Repeated errors: repeated-errors pattern',has(r,21,'Repeated minor errors'),'index '+r.sc[21].s);
 r=analyze(mk((x,i)=>{if(i>=14){x.task+=2*(i-13);x.corr+=.5*(i-13)}return x}),cfg);t('4 Gradual task increase: pattern and alert',has(r,24,'Gradually increasing task duration')&&r.sc[24].s>=20,'index '+r.sc[24].s);
 r=analyze(mk((x,i)=>{if(i>=14&&i<22){x.task+=2*(i-13);x.corr+=.5*(i-13)}return x}),cfg);t('5 Recovery toward baseline',has(r,27,'Recovery toward baseline')&&r.sc[27].s<20,'index '+r.sc[27].s);
 r=analyze(mk(x=>(x.sleep=null,x)),cfg);t('6 Missing sleep excluded, not zero',r.sc[29].con.find(c=>c.k=='sleep').ex==1&&!isNaN(r.sc[29].s),'index '+r.sc[29].s);
 r=analyze(mk((x,i)=>i>2?{errors:null,task:null,corr:null,proc:null,sleep:null,hr:null,fat:null,stress:null}:x),cfg);t('7 Insufficient baseline handled safely',r.sc[10].na===true&&r.sc[10].s===0,'flag '+r.sc[10].na);
 return T}
const S={bl:[1,14],tests:null,ierr:'',th:[20,40,65],N:{},ds:'OSD-569',vy:'',vx:'',err:'',mt:'',a:0,d:29,role:'astro',O:{},ack:{},rev:{},tf:'all',ts:'all',t1:1,t2:30,sel:null,q:'',modal:0,busy:0};
const sev=s=>sevT(s,S.th);
const f1=(x,d=1)=>x==null||isNaN(x)?'n/a':(+x).toFixed(d);
function calc(a=S.a){const D=AST[a].raw.map((x,i)=>({...x,...(S.O[a+'_'+i]||{})})),r=analyze(D,{w:cfgW(),bl:S.bl,th:S.th});return{D,b:r.b,sc:r.sc}}
function explain(c,i){const A=c.sc[i],top=A.con.filter(x=>x.z!=null&&x.z>=1).sort((a,b)=>b.pts-a.pts).map(x=>M[x.k][4].toLowerCase()),n=A.sv=='High'?2:A.sv=='Moderate'?1:0;return(A.pat.length?'Pattern: '+A.pat.join(', ').toLowerCase()+'. ':'')+(top.length?'Indicators above baseline: '+top.join(', ')+'. ':'')+'The index ('+A.s+') exceeds the configured '+['observation','moderate','high'][n]+' threshold ('+S.th[n]+') and requires human review. This is not a medical conclusion.'}
function patList(c){const r=[];for(let i=S.d;i>=Math.max(0,S.d-9);i--)if(c.sc[i].pat.length)r.push(`<div class="ev"><b>Day ${i+1}</b> · index ${c.sc[i].s} · ${c.sc[i].pat.join(' · ')}</div>`);return r.join('')||'<p class="mu">No pattern detected in the last 10 days.</p>'}
function save(){try{localStorage.setItem('nofiraS',JSON.stringify({th:S.th,bl:S.bl,w:cfgW(),imp:AST.filter(a=>a.imp)}))}catch(e){}}
function setBl(i,v){S.bl[i]=clamp(Math.round(+v)||1,1,30);if(S.bl[0]>S.bl[1])S.bl[1-i]=S.bl[i];R()}
function replay(){clearInterval(S.tm);S.d=2;S.tm=setInterval(()=>{if(location.hash!='#simulate'){clearInterval(S.tm);return}S.d++;if(S.d>=29)clearInterval(S.tm);R()},350);R()}
function impOps(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const rows=parseCSV(rd.result),h=rows[0].map(x=>x.trim().toLowerCase()),ix=(...n)=>h.findIndex(x=>n.includes(x)),I={a:ix('astronaut_id','astronaut'),d:ix('mission_day','day'),t:ix('task_time_min','task_time'),e:ix('errors','error_count'),c:ix('correction_min','correction_time'),p:ix('procedural_deviations','proc'),s:ix('sleep_h','sleep')};if([I.a,I.d,I.t,I.e,I.c,I.p].some(x=>x<0))throw 0;const G={};rows.slice(1).forEach(r=>{const day=+r[I.d];if(!(day>=1&&day<=30)||miss(r[I.a]))return;((G[r[I.a]]=G[r[I.a]]||{})[day]=G[r[I.a]][day]||[]).push(r)});
 const vs=(rs,i)=>rs.map(r=>miss(r[i])||isNaN(+r[i])?null:+r[i]).filter(x=>x!=null),sum=(rs,i)=>{const v=vs(rs,i);return v.length?v.reduce((p,c)=>p+c):null},avg=(rs,i)=>{const v=vs(rs,i);return v.length?v.reduce((p,c)=>p+c)/v.length:null};
 const ids=Object.keys(G);if(!ids.length)throw 0;ids.forEach(id=>{const raw=[...Array(30)].map((_,k)=>{const rs=G[id][k+1];return rs?{errors:sum(rs,I.e),proc:sum(rs,I.p),task:avg(rs,I.t),corr:avg(rs,I.c),sleep:I.s>=0?avg(rs,I.s):null,hr:null,fat:null,stress:null}:{errors:null,proc:null,task:null,corr:null,sleep:null,hr:null,fat:null,stress:null}}),a={id,n:id,r:'Imported',ds:0,k:0,s:0,m:{},imp:1,lab:'User-imported operational data',raw},o=AST.findIndex(x=>x.id==id);if(o>=0)AST[o]=a;else AST.push(a)});S.ierr='';S.a=AST.findIndex(x=>x.id==ids[0])}catch(e){S.ierr='Could not import. Required CSV/TSV columns: astronaut_id, mission_day (1-30), task_time_min, errors, correction_min, procedural_deviations. Optional: sleep_h.'}R()};rd.onerror=()=>{S.ierr='The file could not be read.';R()};rd.readAsText(f)}
function tplCSV(){S.mt='astronaut_id,mission_day,task_id,task_time_min,errors,correction_min,procedural_deviations,sleep_h\nEXAMPLE-1,1,T1,41.2,1,5.0,0,7.1\nEXAMPLE-1,1,T2,39.8,0,4.5,0,7.1\nEXAMPLE-1,2,T1,42.0,2,5.8,1,6.9';S.modal=1;R()}
function lc(sets,i,h=140){const W=600,p=8;let g='';sets.forEach(s=>{const f=s.v.filter(okn);if(!f.length)return;const mn=Math.min(...f),mx=Math.max(...f),r=mx-mn||1,pt=s.v.map((y,k)=>[p+k*(W-2*p)/29,okn(y)?h-p-(y-mn)/r*(h-2*p):null]);let d='',pen=0;pt.forEach(q=>{if(q[1]==null)pen=0;else{d+=(pen?'L':'M')+q[0]+','+q[1];pen=1}});g+=`<path fill="none" stroke="${s.c}" stroke-width="2" d="${d}"/>`+pt.map((q,k)=>q[1]==null?'':`<circle cx="${q[0]}" cy="${q[1]}" r="${k==i?4.5:5}" fill="${k==i?s.c:'transparent'}"><title>Day ${k+1} · ${s.n}: ${f1(s.v[k])}</title></circle>`).join('')});const x=p+i*(W-2*p)/29;
 return`<svg viewBox="0 0 ${W} ${h}"><line x1="${x}" x2="${x}" y1="0" y2="${h}" stroke="#fff3" stroke-dasharray="4"/>${g}</svg><div class="lg">${sets.map(s=>`<span style="color:${s.c}">● ${s.n}</span>`).join('')}<span>(each series scaled to its own range; gaps = no data)</span></div>`}
function bars(v,i,sc){const W=600,h=110,mx=Math.max(...v,1);return`<svg viewBox="0 0 ${W} ${h}">${v.map((y,k)=>`<rect x="${k*20+2}" y="${h-y/mx*(h-6)}" width="15" height="${y/mx*(h-6)}" rx="3" fill="${sc[k].s>=S.th[0]?'var(--wa)':'var(--c2)'}" opacity="${k>i?.2:1}"><title>Day ${k+1}: ${y} errors · score ${sc[k].s}</title></rect>`).join('')}</svg>`}
function scat(D,i){const P=D.slice(0,i+1).filter(d=>d.sleep!=null&&d.errors!=null),n=P.length,mx=P.reduce((p,c)=>p+c.sleep,0)/n,my=P.reduce((p,c)=>p+c.errors,0)/n;let sxy=0,sx=0,sy=0;P.forEach(d=>{sxy+=(d.sleep-mx)*(d.errors-my);sx+=(d.sleep-mx)**2;sy+=(d.errors-my)**2});const r=sx&&sy?sxy/Math.sqrt(sx*sy):0;
 return`<svg viewBox="0 0 300 150"><rect width="300" height="150" fill="none" stroke="var(--bd)"/>${P.map((d,k)=>`<circle cx="${(d.sleep-3)/8*280+10}" cy="${140-d.errors/12*130}" r="${k==i?6:4}" fill="${k==i?'var(--c1)':'var(--c3)'}" opacity=".8"><title>Day ${k+1}: sleep ${f1(d.sleep)} h, ${d.errors} errors</title></circle>`).join('')}</svg><div class="mu">x: sleep (h) · y: errors/day · Pearson r = <b>${f1(r,2)}</b> over days 1–${n}. Statistical association only — no causal claim.</div>`}
const col=s=>s>=S.th[2]?'var(--hi)':s>=S.th[1]?'var(--wa)':s>=S.th[0]?'var(--c1)':'var(--ok)';
function gauge(s){return`<div class="row"><span class="big ${sev(s)}">${s}</span><span class="mu">/100 · ${sev(s)=='Normal'?'Within baseline':sev(s)+(sev(s)=='Observation'?'':' deviation')}</span></div><div class="bar"><i style="width:${s}%;background:${col(s)}"></i></div>`}
function alertCard(c,i,key=S.a+'_'+i){const A=c.sc[i],top=A.con.filter(x=>x.z>=1).sort((a,b)=>b.pts-a.pts),hl=top.filter(x=>['sleep','hr','fat','stress'].includes(x.k)),op=top.filter(x=>['errors','task','corr'].includes(x.k));
 return`<div class="c" style="border-left:4px solid ${col(A.s)}"><div class="row"><b>Performance Deviation Detected</b><span class="tag ${A.sv}">${A.sv}</span><span class="tag">Score ${A.s}</span><span class="tag">ALR-${AST[S.a].id}-D${i+1}</span><span class="mu">${AST[S.a].id} · Mission Day ${i+1} · Index ${A.s}/100</span>${S.ack[key]?'<span class="tag ok">Acknowledged</span>':''}</div>
 <p style="margin:6px 0"><b>${A.sv}:</b> ${explain(c,i)}</p><p class="mu" style="margin:6px 0">Observed (3-day average vs. baseline days ${S.bl[0]}–${S.bl[1]}):</p><ul style="margin:0 0 6px 18px">${top.map(x=>`<li>${M[x.k][4]} (z = ${f1(x.z)})</li>`).join('')}</ul>
 <div class="mu">Health indicators: ${hl.map(x=>M[x.k][0]).join(', ')||'none deviating'} · Related operational events (${c.D.slice(Math.max(0,i-2),i+1).map((d,k)=>'D'+(Math.max(0,i-2)+k+1)+': '+f1(d.errors,0)+' err, '+f1(d.proc,0)+' proc').join('; ')}): ${op.map(x=>M[x.k][0]).join(', ')||'none deviating'}</div>
 <p><b>Recommended next action:</b> ${A.s>=S.th[2]?'Priority review of astronaut workload and available health data with the mission control medical team.':A.s>=S.th[1]?'Review astronaut workload and available health data at the next scheduled check-in.':'Continue monitoring; consider a workload and rest-schedule check.'}</p>
 <p class="mu">⚠ System-generated observation from a rule-based model. It is not a medical conclusion or diagnosis and does not establish cause.</p>
 <div class="row noprint"><button onclick="S.ack['${key}']=1;R()">Acknowledge</button><button onclick="S.rev['${key}']=!S.rev['${key}'];R()">${S.rev[key]?'Hide':'Review'} rule details</button></div>
 ${S.rev[key]?`<table style="margin-top:8px"><tr><th>Metric</th><th>3-day avg</th><th>Baseline</th><th>z</th><th>Points</th></tr>${A.con.map(x=>`<tr><td>${M[x.k][0]}</td><td>${f1(x.avg)}</td><td>${f1(c.b[x.k].m)}</td><td>${f1(x.z)}</td><td>${f1(x.pts)} / ${M[x.k][1]}</td></tr>`).join('')}</table>`:''}</div>`}
const alertsOf=c=>c.sc.map((a,i)=>({i,...a})).filter(a=>a.s>=S.th[0]).reverse();
function kpis(c){const d=c.D[S.d],A=c.sc[S.d];const K=[['Proc. deviations','proc',''],['Heart rate','hr','bpm'],['Sleep','sleep','h'],['Fatigue','fat',''],['Stress','stress',''],['Errors/day','errors',''],['Task time','task','min'],['Correction time','corr','min']];

function method(){return`<h2>Methodology & About NOFIRA</h2><div class="g g2"><div class="c"><h3>The innovation</h3><p>Single small mistakes look like noise. NOFIRA treats <b>accumulated small signals</b> — repeated errors, slower tasks, longer corrections — together with sleep, heart rate, fatigue and stress, and flags when the pattern drifts from the astronaut’s <i>own</i> baseline.</p><p class="mu"><b>Scope:</b> research and decision-support prototype. It does not diagnose disease and does not claim a causal link between health indicators and errors. Operational data are simulated (SYNTHETIC DEMO). NASA OSD-569 / OSD-575 data appear only after you import the original files. Scores are DERIVED ANALYSIS. The categories are never mixed silently.</p></div>
 <div class="c"><h3>Algorithm (rule-based, deterministic)</h3><ol><li>Baseline: mean and SD over a selectable period (default days 1–14); needs ≥ 5 observations per indicator, otherwise that indicator is excluded. Missing values are never treated as zero.</li><li>Current value: mean of the last 3 days with data.</li><li>z = direction × (current − baseline mean) ÷ SD (−1 for sleep). SD is floored (5% of mean and a fixed minimum per indicator) so tiny baselines do not explode.</li><li>Normalisation: clamp(z ÷ 3, 0, 1) per indicator, then weighted: errors 20, task time 20, correction 15, procedural deviations 15, sleep 10, fatigue 10, heart rate 5, stress 5 (configurable).</li><li>Index = 100 × Σ weighted points ÷ Σ weights of indicators that were available.</li><li>Categories (configurable): Normal &lt; 20, Observation ≥ 20, Moderate deviation ≥ 40, High deviation ≥ 65.</li><li>Patterns: isolated error, repeated minor errors (≥ 2 of 3 days), gradually increasing task or correction time (3 consecutive rises above baseline), repeated procedural deviations, accumulation across ≥ 3 indicators, recovery toward baseline.</li></ol><p class="mu"><b>NOFIRA is an experimental decision-support prototype. It is not a medical diagnostic system and does not replace flight surgeons or mission-control judgment.</b> Observations, simulation and derived analysis are labeled separately; correlation never establishes causation.</p></div>
 <div class="c"><h3>Weights</h3><table>${Object.values(M).map(m=>`<tr><td>${m[0]}</td><td>${m[1]}</td></tr>`).join('')}</table></div>
 <div class="c"><h3>Data schema (per astronaut-day)</h3><p class="mu">day, errors (count), task (min), corr (min), sleep (h), hr (bpm), fat (0–100), stress (0–100). Seeded generator; Okafor drifts from day 18, Mori mildly from day 22, Reyes stays stable.</p><p class="mu">Limitations: thresholds are illustrative and not clinically validated; real use needs validated data and expert review.</p></div></div>`}

function parseCSV(t){const l=t.split('\n')[0],d=l.split('\t').length>l.split(',').length?'\t':',',rows=[];let r=[],f='',q=0;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){f+='"';i++}else q=0}else f+=ch}else if(ch=='"')q=1;else if(ch==d){r.push(f);f=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(f);f='';if(r.length>1||r[0]!=='')rows.push(r);r=[]}else f+=ch}if(f!==''||r.length){r.push(f);rows.push(r)}return rows}

 <div class="c" style="overflow-x:auto"><h3>Metadata & missing values</h3><table><tr><th>Variable</th><th>Type</th><th>Missing</th></tr>${nc.slice(0,60).map(x=>`<tr><td>${x.c}</td><td>${x.num?'numeric':'text'}</td><td>${x.m}/${x.n} (${f1(x.m/Math.max(1,x.n)*100)}%)</td></tr>`).join('')}</table></div>

function sources(){const rows=Object.keys(ST).map(k=>{const N=S.N[k],I=ST[k];let st='<span class="High">Not imported</span>',rc='—',ms='—';if(N){const tot=N.rows.length*N.cols.length,m=N.rows.reduce((p,r)=>p+N.cols.reduce((q,_,i)=>q+(miss(r[i]||'')?1:0),0),0);st='<span class="ok">Imported ('+N.file+')</span>';rc=N.rows.length+' rows × '+N.cols.length+' cols';ms=f1(m/tot*100)+'% of cells'}return`<tr><td>${B.n} ${I.t}</td><td>${k}</td><td><a href="${I.u}" target="_blank" rel="noopener">OSDR</a></td><td>${I.k}</td><td>As in original file</td><td>${rc}</td><td>${ms}</td><td>Original timepoints (see Explorer)</td><td>${st}</td></tr>`}).join('');
return`<h2>Data Sources</h2><div class="c" style="overflow-x:auto"><table><tr><th>Study</th><th>Accession</th><th>Source</th><th>Data type</th><th>Units</th><th>Records</th><th>Missing</th><th>Timepoints</th><th>Status</th></tr>${rows}<tr><td>${B.s} Simulated astronaut telemetry</td><td>—</td><td>Seeded generator</td><td>Sleep, HR, fatigue, stress, errors, task and correction time</td><td>h, bpm, 0–100, count, min</td><td>3 × 30 days × 7</td><td>0%</td><td>Daily</td><td>Generated</td></tr><tr><td>${B.d} Operational Deviation Index</td><td>—</td><td>NOFIRA engine</td><td>0–100 index</td><td>points</td><td>90 days</td><td>0%</td><td>Daily</td><td>Computed</td></tr></table></div>`}
function profiles(){return`<h2>Astronaut Profiles</h2><div class="g g2">${AST.map((a,i)=>{const A=calc(i).sc[S.d];return`<div class="c"><h3>${a.n}</h3><p class="mu">${a.id} · ${a.r} · ${B.s}</p>${gauge(A.s)}<p class="mu">Scenario: ${a.lab}</p><button onclick="S.a=${i};location.hash='dashboard'">Open overview</button></div>`}).join('')}</div>`}
function health(c){const D=c.D;return`<h2>Health Intelligence</h2><div class="g g2">${[['Sleep (h)','sleep','#22d3ee'],['Heart rate (bpm)','hr','#f87171'],['Fatigue','fat','#8b5cf6'],['Stress','stress','#fbbf24']].map(([n,k,cc])=>`<div class="c"><h3>${n} ${B.s}</h3>${lc([{n,v:D.map(x=>x[k]),c:cc}],S.d)}</div>`).join('')}</div><div class="c" style="margin-top:14px"><h3>Biological research data ${B.n}</h3><p class="mu">Kept separate from simulated values. ${Object.keys(S.N).length?'Imported: '+Object.keys(S.N).join(', '):'None imported yet'}. Open the <a href="#nasa">NASA Data Explorer</a>. Sparse research samples are never shown as continuous monitoring.</p></div>`}
function perf(c){const D=c.D,A=c.sc[S.d];return`<h2>Performance Intelligence</h2><div class="g g2"><div class="c"><h3>Errors per day ${B.s}</h3>${bars(D.map(x=>x.errors),S.d,c.sc)}</div><div class="c"><h3>Task and correction time ${B.s}</h3>${lc([{n:'Task',v:D.map(x=>x.task),c:'#3b82f6'},{n:'Correction',v:D.map(x=>x.corr),c:'#fbbf24'}],S.d)}</div><div class="c"><h3>Procedural deviations ${B.s}</h3>${lc([{n:'Procedural deviations',v:D.map(x=>x.proc),c:'#8b5cf6'}],S.d)}</div></div><div class="c" style="margin-top:14px"><h3>Change vs baseline ${B.d}</h3><table><tr><th>Metric</th><th>3-day avg</th><th>Baseline</th><th>Change</th></tr>${A.con.map(x=>`<tr><td>${M[x.k][0]}</td><td>${f1(x.avg)}</td><td>${f1(c.b[x.k].m)}</td><td>${f1((x.avg/c.b[x.k].m-1)*100)}%</td></tr>`).join('')}</table></div>`}
function engine(c){const A=c.sc[S.d],bsel=(i)=>`<input type="number" min="1" max="30" style="width:70px" value="${S.bl[i]}" onchange="setBl(${i},this.value)">`;return`<h2>NOFIRA Analysis Engine</h2><div class="c"><h3>Operational Deviation Index ${B.d}</h3>${gauge(A.s)}${A.na?'<p class="High">Insufficient baseline observations (at least 5 per indicator). Affected indicators are excluded, never treated as zero.</p>':''}<p class="mu">Index = 100 × Σ wᵢ·clamp(zᵢ ÷ 3, 0, 1) ÷ Σ wᵢ, summed over indicators that have a valid baseline and data. zᵢ = direction × (3-day mean − baseline mean) ÷ baseline SD (SD has an absolute floor per indicator). Pattern rules add the explanation. Not a medical risk score.</p></div>
<div class="g g2" style="margin-top:14px"><div class="c"><h3>Baseline period</h3><div class="row">Days ${bsel(0)} – ${bsel(1)}</div><p class="mu">Currently days ${S.bl[0]}–${S.bl[1]}. Needs ≥ 5 observations per indicator.</p><h3>Thresholds</h3><div class="row">${['Observation','Moderate','High'].map((n,i)=>`<label>${n} ≥ <input type="number" min="1" max="100" style="width:70px" value="${S.th[i]}" onchange="S.th[${i}]=+this.value;R()"></label>`).join('')}</div></div>
<div class="c"><h3>Weights</h3><div class="row">${KEYS.map(k=>`<label class="mu">${M[k][0]} <input type="number" min="0" max="100" style="width:64px" value="${M[k][1]}" onchange="M['${k}'][1]=+this.value;R()"></label>`).join('')}</div><button onclick="try{localStorage.removeItem('nofiraS');localStorage.removeItem('nofiraN')}catch(e){}location.reload()">Reset all settings and imported data</button></div></div>
<div class="c" style="margin-top:14px"><h3>Contributing variables (Day ${S.d+1}) ${B.d}</h3><table><tr><th>Variable</th><th>Weight</th><th>3-day mean</th><th>Baseline</th><th>z</th><th>Points</th></tr>${A.con.map(x=>`<tr><td>${M[x.k][0]}</td><td>${M[x.k][1]}</td><td>${f1(x.avg)}</td><td>${f1(c.b[x.k].m)}</td><td>${f1(x.z)}</td><td>${x.ex?'excluded':f1(x.pts)}</td></tr>`).join('')}</table></div>
<div class="c" style="margin-top:14px"><h3>Import operational event data ${B.u}</h3><p class="mu">CSV/TSV with astronaut_id, mission_day (1–30), task_time_min, errors, correction_min, procedural_deviations, optional sleep_h. Multiple tasks per day are aggregated (time = mean, counts = sum). Missing values stay missing.</p><div class="row"><input type="file" accept=".csv,.tsv,.txt" onchange="impOps(this)"><button onclick="tplCSV()">Show template</button></div>${S.ierr?`<p class="High">${S.ierr}</p>`:''}</div>
<div class="c" style="margin-top:14px"><h3>Engine tests</h3><button class="pri" onclick="S.tests=runTests();R()">Run engine tests</button>${S.tests?`<table><tr><th>Case</th><th>Result</th><th>Detail</th></tr>${S.tests.map(t=>`<tr><td>${t.n}</td><td class="${t.ok?'ok':'High'}">${t.ok?'PASS':'FAIL'}</td><td>${t.d}</td></tr>`).join('')}</table>`:''}</div>`}
function about(){return`<h2>About NOFIRA</h2><div class="c"><p>NOFIRA — Small Signals Matter. Built for the NASA Space Apps Challenge 2026: <i>Create Health Monitoring Software for Astronauts on Space Missions</i>.</p><p>Single small errors look like noise; accumulated patterns are the signal. NOFIRA tracks each astronaut against their own baseline and explains every alert.</p><p class="mu"><b>Limitations:</b> research and decision-support prototype, not a diagnostic system. Operational and physiological telemetry here is synthetic. NASA OSD-569 and OSD-575 are sparse biological samples and are never presented as continuous monitoring. Correlation is not causation.</p></div>`}
function R(){save();const h=(location.hash.slice(1)||'home');if(h=='control')S.role='mc';if(h=='astronaut')S.role='astro';const c=calc(),pages={home:()=>home(),dashboard:()=>dash(c),control:()=>dash(c),astronaut:()=>dash(c),profiles:()=>profiles(),health:()=>health(c),performance:()=>perf(c),engine:()=>engine(c),alerts:()=>alerts(c),timeline:()=>tl(c),simulate:()=>sim(),nasa:()=>nasa(),sources:()=>sources(),method:()=>method(),about:()=>about(),report:()=>report(c)};
 const nav=[['home','Home'],['dashboard','Overview'],['profiles','Profiles'],['health','Health'],['performance','Performance'],['engine','Engine'],['alerts','Alerts'],['timeline','Timeline'],['control','Mission Control'],['astronaut','Astronaut'],['simulate','Simulation Lab'],['nasa','NASA Data'],['sources','Sources'],['method','Method'],['about','About']];
 const o=(a,v)=>a.map((x,i)=>`<option value="${i}" ${i==v?'selected':''}>${x}</option>`).join('');
 $('#app').innerHTML=`<nav><b>NOFIRA</b>${nav.map(n=>`<a href="#${n[0]}" class="${h==n[0]?'on':''}">${n[1]}</a>`).join('')}</nav>
 ${!['home','method','about','sources','nasa'].includes(h)?`<div class="row noprint" style="padding:10px 16px;max-width:1100px;margin:auto"><select onchange="S.role=this.value;R()"><option value="astro" ${S.role=='astro'?'selected':''}>Astronaut view</option><option value="mc" ${S.role=='mc'?'selected':''}>Mission control view</option></select><select onchange="S.a=+this.value;R()">${o(AST.map(a=>a.id+' · '+a.n),S.a)}</select><select onchange="S.d=+this.value;S.sel=null;R()">${o([...Array(30)].map((_,i)=>'Day '+(i+1)),S.d)}</select><button onclick="S.modal=1;R()">Export CSV</button><a href="#report"><button>PDF report</button></a></div>`:''}
 <main>${h!='home'?'<div class="mu" style="margin-bottom:8px">Data classes: '+B.n+' '+B.s+' '+B.d+'</div>':''}${(pages[h]||pages.home)()}</main>${S.modal?`<div class="modal"><div class="c"><h3>CSV export — ${S.mt?'NASA '+S.ds+' (uploaded file)':AST[S.a].id+' · SYNTHETIC + DERIVED'}</h3><textarea readonly id="cv">${S.mt||csv()}</textarea><div class="row"><button class="pri" onclick="try{navigator.clipboard.writeText($('#cv').value)}catch(e){$('#cv').select()}">Copy</button><button onclick="try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('#cv').value],{type:'text/csv'}));a.download='nofira_${AST[S.a].id}.csv';a.click()}catch(e){}">Try download</button><button onclick="S.modal=0;S.mt='';R()">Close</button></div></div></div>`:''}`}
try{const p=JSON.parse(localStorage.getItem('nofiraS')||'null');if(p){if(p.th)S.th=p.th;if(p.bl)S.bl=p.bl;KEYS.forEach(k=>{if(p.w&&p.w[k]!=null)M[k][1]=p.w[k]});(p.imp||[]).forEach(a=>{if(!AST.find(x=>x.id==a.id))AST.push(a)})}}catch(e){}
addEventListener('hashchange',()=>{R();scrollTo(0,0)});R();
